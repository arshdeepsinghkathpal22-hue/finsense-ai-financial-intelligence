# nginx site for the FinSense AI web container.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Upload limit slightly above the API's own limits (documents 15 MB, CSV 20 MB).
    client_max_body_size 25m;

    # API: same-origin reverse proxy. X-Forwarded-For is *overwritten* with the
    # real peer address so clients cannot spoof the IP used for rate limiting.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering on;
    }

    # Fingerprinted build assets can be cached for a long time.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        try_files $uri =404;
    }

    # Client-side routes fall back to index.html, which is never cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
