# FinSense AI - full stack: PostgreSQL + pgvector, one-shot bootstrap, API, web.
# Start with ./run.sh (Linux/macOS) or run.bat (Windows), which create .env with
# random passwords on first use, or manually: cp .env.example .env (edit the
# passwords), then `docker compose up --build -d`. Open http://localhost:8080.
name: finsense

x-api-env: &api-env
  APP_ENV: production
  DATABASE_URL: postgresql+psycopg://finsense_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB:-finsense}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
  CORS_ORIGINS: ${PUBLIC_APP_URL:-http://localhost:8080}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  TRUST_PROXY_HEADERS: "true"
  EXPOSE_API_DOCS: ${EXPOSE_API_DOCS:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  RISK_FREE_RATE: ${RISK_FREE_RATE:-0.065}
  LLM_PROVIDER: ${LLM_PROVIDER:-none}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  AMFI_ENABLED: ${AMFI_ENABLED:-false}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finsense}
      POSTGRES_USER: ${POSTGRES_USER:-finsense_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    # Deliberately no published port: only the containers on this network reach the database.

  bootstrap:
    build: ./backend
    command: ["python", "-m", "app.cli", "bootstrap"]
    environment:
      <<: *api-env
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-finsense_owner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-finsense}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    volumes:
      - app-data:/app/var
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    environment: *api-env
    volumes:
      - app-data:/app/var
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  app-data:
